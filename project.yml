name: TermoBar
options:
  bundleIdPrefix: br.com.gbrlrg
  # Inglês é o idioma padrão; as chaves dos textos no código continuam em português
  # e o Localizable.xcstrings traz as duas traduções (veja docs/DEVELOPMENT.md).
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  TermoBar:
    type: application
    platform: macOS
    sources: [TermoBar]
    info:
      path: TermoBar/Info.plist
      properties:
        CFBundleDisplayName: TermoBar
        # Quem usa outro idioma que não português nem inglês vê o app em inglês.
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        NSHumanReadableCopyright: "© 2026 Gabriel Rigon"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
    dependencies:
      - sdk: libIOReport.tbd
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.gbrlrg.termobar
        SWIFT_OBJC_BRIDGING_HEADER: TermoBar/Hardware/Bridging.h
        # Ícone do Icon Composer (TermoBar/AppIcon.icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Runtime endurecido: bloqueia injeção de código e bibliotecas não assinadas.
        # O app não pode usar App Sandbox: lê processos de outros apps e APIs privadas do IOKit.
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: [TermoBarTests]

  # Testes da lógica pura (Domain, Persistence e Preferences), compilada junto com os testes:
  # não abre o app nem depende de sensores.
  TermoBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TermoBarTests
      - TermoBar/Domain
      - TermoBar/Persistence
      - TermoBar/Services/Preferences.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.gbrlrg.termobar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
