name: TermoBar
options:
  bundleIdPrefix: br.com.gbrlrg
  # Inglês é o idioma padrão; as chaves dos textos no código continuam em português
  # e o Localizable.xcstrings traz as duas traduções (veja docs/DEVELOPMENT.md).
  developmentLanguage: en
  deploymentTarget:
    macOS: "15.0"
packages:
  # Atualização automática: lê o appcast publicado junto com cada versão no GitHub.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Versão do app e do widget, que precisam ser iguais.
    MARKETING_VERSION: "1.4.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  TermoBar:
    type: application
    platform: macOS
    sources: [TermoBar]
    info:
      path: TermoBar/Info.plist
      properties:
        CFBundleDisplayName: TermoBar
        # Quem usa outro idioma que não português nem inglês vê o app em inglês.
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Gabriel Rigon"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        # Sparkle: o appcast.xml vai como anexo de cada versão no GitHub, e a chave pública confere
        # a assinatura de cada atualização (a privada fica no Keychain de quem publica).
        SUFeedURL: https://github.com/gbrlrg/termo-bar/releases/latest/download/appcast.xml
        SUPublicEDKey: b3odm7qNLCbQbzA/ZZseiT3pcRQigPozW4NsKZ20Sek=
    # O App Group é a pasta compartilhada com o widget; o app em si continua fora do sandbox.
    entitlements:
      path: TermoBar/TermoBar.entitlements
      properties:
        com.apple.security.application-groups: [F22LFNZSAZ.br.com.gbrlrg.termobar]
    dependencies:
      - sdk: libIOReport.tbd
      - sdk: libsqlite3.tbd
      - target: TermoBarWidget
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.gbrlrg.termobar
        SWIFT_OBJC_BRIDGING_HEADER: TermoBar/Hardware/Bridging.h
        # Ícone do Icon Composer (TermoBar/AppIcon.icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        # Runtime endurecido: bloqueia injeção de código e bibliotecas não assinadas.
        # O app não pode usar App Sandbox: lê processos de outros apps e APIs privadas do IOKit.
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets: [TermoBarTests]

  # Widget da mesa e da Central de Notificações. Roda em sandbox e só lê o resumo que o app grava
  # no App Group (TermoBar/Shared/WidgetSnapshot.swift).
  TermoBarWidget:
    type: app-extension
    platform: macOS
    sources:
      - TermoBarWidget
      - TermoBar/Shared
      - TermoBar/UI/Theme.swift
      - TermoBar/Domain/ThermalPressure.swift
    info:
      path: TermoBarWidget/Info.plist
      properties:
        CFBundleDisplayName: TermoBar
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: "© 2026 Gabriel Rigon"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: TermoBarWidget/TermoBarWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [F22LFNZSAZ.br.com.gbrlrg.termobar]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.gbrlrg.termobar.widget
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  # Testes da lógica pura (Domain, Persistence e Preferences) e do menu da barra, compilados junto
  # com os testes: não abre o app nem depende de sensores.
  TermoBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - TermoBarTests
      - TermoBar/Domain
      - TermoBar/Persistence
      - TermoBar/Services/Preferences.swift
      - TermoBar/UI/MenuBar/StatusItemContextMenu.swift
    dependencies:
      - sdk: libsqlite3.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.gbrlrg.termobar.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
